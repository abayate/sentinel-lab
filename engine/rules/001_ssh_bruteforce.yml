id: LAB-001
title: SSH Brute Force
description: >
  Five or more failed SSH password attempts from a single source IP within two
  minutes. Indicates automated password guessing rather than a user typo.
level: high
mitre:
  - T1110.001          # Brute Force: Password Guessing
source: auth
type: threshold
pattern: 'Failed password for (?:invalid user )?(?P<user>\S+) from (?P<src_ip>\d+\.\d+\.\d+\.\d+)'
group_by: src_ip
threshold: 5
window_seconds: 120
